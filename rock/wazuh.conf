template(name="TraditionalFormat" type="string"
         string="%TIMESTAMP% %HOSTNAME% %syslogtag%%msg%\n")

$ActionFileDefaultTemplate TraditionalFormat

$ModLoad imtcp

# Enforce Mutual TLS (Require Client Certificate)
$InputTCPServerStreamDriverAuthMode x509/name
$InputTCPServerStreamDriverPermittedPeer rsyslog-agent

# If Mutual TLS is not required (no client certificates) uncomment the following line
# $InputTCPServerStreamDriverAuthMode anon

$InputTCPServerStreamDriverMode 1
$DefaultNetstreamDriver gtls
$DefaultNetstreamDriverCAFile /etc/rsyslog.d/certs/root-ca.pem
$DefaultNetstreamDriverCertFile /etc/rsyslog.d/certs/certificate.pem
$DefaultNetstreamDriverKeyFile /etc/rsyslog.d/certs/certificate.key
$InputTCPServerRun 6514

# Storing Messages from a Remote System into a specific File 
#if $fromhost-ip startswith '<ENDPOINT_IP>' then /var/log/endpoint_logs 
#& ~

# Write one file per hour, named after the time rsyslog received the messages.
# wazuh-logcollector reads them through a wildcard.
template(name="WazuhIngestFile" type="string"
         string="/var/log/collectors/rsyslog/rsyslog-%$year%-%$month%-%$day%-%$hour%.log")
action(type="omfile" dynaFile="WazuhIngestFile" template="TraditionalFormat" closeTimeout="10")

# Pre-create the hourly files and delete them once read by Wazuh. impstats emits rsyslog's
# statistics every 10 seconds to a dedicated ruleset, used only as a clock: omprog keeps the
# maintenance program running and sends it a line for each statistics message.
module(load="impstats" interval="10" ruleset="wazuh_ingest_maintenance")
module(load="omprog")
template(name="WazuhIngestTick" type="string" string="tick\n")
ruleset(name="wazuh_ingest_maintenance" queue.type="LinkedList") {
  action(type="omprog" binary="/usr/local/bin/rsyslog-ingest-maintenance"
         template="WazuhIngestTick")
}
