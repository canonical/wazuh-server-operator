juju:
  channel: 3/stable

providers:
  microk8s:
    enable: true
    bootstrap: true
    addons:
      - hostpath-storage
      - dns
      - rbac
      - registry
    model-defaults:
      test-mode: "true"
      automatically-retry-hooks: "false"
  lxd:
    enable: true
    bootstrap: true
    model-defaults:
      test-mode: "true"
      automatically-retry-hooks: "false"

host:
  snaps:
    rockcraft:
    charmcraft:
