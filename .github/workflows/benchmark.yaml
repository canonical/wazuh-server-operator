name: Benchmark

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Reconcile benchmark
    runs-on: ["self-hosted", "self-hosted-linux-amd64-noble-large"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install tox
        run: uv tool install tox --with tox-uv

      - name: Setup operator environment
        uses: charmed-kubernetes/actions-operator@main
        with:
          provider: microk8s
          channel: 1.34-strict/stable
          microk8s-addons: "storage dns rbac registry"
          juju-channel: 3/stable

      - name: Install build tools
        run: |
          sudo snap install charmcraft --classic
          sudo snap install rockcraft --classic
          sudo apt-get install -y skopeo

      - name: Configure system for wazuh-indexer
        # wazuh-indexer is OpenSearch-based and requires these kernel parameters.
        run: |
          sudo tee -a /etc/sysctl.conf > /dev/null <<'EOT'
          vm.max_map_count=262144
          vm.swappiness=0
          net.ipv4.tcp_retries2=5
          fs.file-max=1048576
          EOT
          sudo sysctl -p

      - name: Bootstrap LXD machine controller
        # wazuh-indexer and wazuh-dashboard are deployed on an LXD machine controller.
        # LXD is pre-installed on the self-hosted runner; we only need to initialise it
        # and bootstrap a Juju controller named "localhost".
        run: |
          K8S_MODEL=$(juju switch)
          sudo lxd init --auto
          juju bootstrap localhost localhost
          juju switch "${K8S_MODEL}"

      - name: Build charm
        run: charmcraft pack --verbose

      - name: Build and push rock image
        run: |
          cd rock
          rockcraft pack --verbose
          ROCK=$(ls *.rock | head -1)
          skopeo --insecure-policy copy --dest-tls-verify=false \
            oci-archive:"${ROCK}" \
            docker://localhost:32000/wazuh-server:benchmark

      - name: Run benchmark
        run: |
          CHARM=$(ls *.charm | head -1)
          tox -e benchmark -- \
            --charm-file "${CHARM}" \
            --wazuh-server-image "localhost:32000/wazuh-server:benchmark" \
            --full-deploy \
            --machine-controller localhost
