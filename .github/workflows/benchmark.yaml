name: Benchmark

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Reconcile benchmark
    runs-on: ["self-hosted", "self-hosted-linux-amd64-noble-large"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install build tools
        run: |
          sudo snap install charmcraft --classic
          sudo snap install rockcraft --classic

      - name: Set up Canonical K8s
        run: |
          sudo snap install k8s --channel 1.33-classic/stable --classic
          cat << EOF | sudo k8s bootstrap --file -
          containerd-base-dir: /opt/containerd
          EOF
          sudo k8s status --wait-ready --timeout 120s
          mkdir -p ~/.kube
          sudo k8s config > ~/.kube/config

      - name: Set up local image registry
        run: |
          docker run -d -p 32000:5000 --name registry registry:2
          # Allow containerd to pull from the insecure local registry
          sudo mkdir -p /var/snap/k8s/common/etc/containerd/hosts.d/localhost:32000
          printf '[host."http://localhost:32000"]\n  capabilities = ["pull", "resolve"]\n' \
            | sudo tee /var/snap/k8s/common/etc/containerd/hosts.d/localhost:32000/hosts.toml
          sudo snap restart k8s

      - name: Set up Juju
        run: |
          sudo snap install juju --channel 3/stable
          juju bootstrap k8s k8s --config controller-service-type=loadbalancer
          juju add-model default

      - name: Build charm
        run: charmcraft pack --verbose

      - name: Build and push rock image
        run: |
          cd rock
          rockcraft pack --verbose
          ROCK=$(ls *.rock | head -1)
          skopeo --insecure-policy copy --dest-tls-verify=false \
            oci-archive:"${ROCK}" \
            docker://localhost:32000/wazuh-server:benchmark

      - name: Run benchmark
        run: |
          CHARM=$(ls *.charm | head -1)
          tox -e benchmark -- \
            --charm-file "${CHARM}" \
            --wazuh-server-image "localhost:32000/wazuh-server:benchmark"
